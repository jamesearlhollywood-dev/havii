services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: havii
      POSTGRES_PASSWORD: havii_dev_password
      POSTGRES_DB: havii
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U havii -d havii"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: on-failure
    volumes:
      - havii-db:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro

  web:
    image: node:22
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    working_dir: /app
    command: ["sh", "-ec", "npm install --no-audit --no-fund && exec npm run dev -- --hostname 0.0.0.0 --port 3000"]
    environment:
      - DATABASE_URL=postgres://havii:havii_dev_password@db:5432/havii
      - JWT_SECRET=havii-dev-jwt-secret-change-in-production-32chars
      - NEXT_PUBLIC_SITE_URL=https://3000-${BASE44_PUBLIC_HOST_SUFFIX}
      - BASE44_PUBLIC_HOST_SUFFIX
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s
    restart: on-failure

volumes:
  havii-db:
