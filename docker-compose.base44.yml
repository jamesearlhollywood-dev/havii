services:
  web:
    image: node:22-slim
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    environment:
      - BASE44_PUBLIC_HOST_SUFFIX=${BASE44_PUBLIC_HOST_SUFFIX:-}
      - BASE44_SANDBOX_HOST_DOMAIN=${BASE44_SANDBOX_HOST_DOMAIN:-}
      - NEXT_PUBLIC_SITE_URL=http://localhost:3000
      - NODE_ENV=development
      - WATCHPACK_POLLING=true
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    command: ["sh", "-ec", "[ -f node_modules/.package-lock.json ] || npm ci; exec npm run dev -- -H 0.0.0.0 -p 3000"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      start_period: 180s
      interval: 15s
      timeout: 10s
      retries: 6
    restart: on-failure
